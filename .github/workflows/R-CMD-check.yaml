name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  R-CMD-check:
    name: ${{ matrix.config.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - {label: "R release", r: "release"}
          - {label: "R devel", r: "devel"}

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rcmdcheck
            any::rmarkdown
            any::roxygen2
          needs: check

      - name: Generate documentation
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise(".", roclets = c("rd", "namespace"))

      - name: Commit regenerated examples documentation
        if: github.event_name == 'pull_request' && matrix.config.r == 'release'
        shell: bash
        run: |
          if git diff --quiet -- man NAMESPACE; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add man NAMESPACE
          git commit -m "docs: regenerate manuals with examples"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
