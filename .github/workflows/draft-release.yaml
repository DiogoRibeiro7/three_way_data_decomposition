name: Draft-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Build checked draft release
    runs-on: ubuntu-latest

    env:
      R_KEEP_PKG_SOURCE: yes
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rcmdcheck
            any::rmarkdown
            any::roxygen2
          needs: check

      - name: Validate tag and package version
        shell: Rscript {0}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag <- Sys.getenv("RELEASE_TAG")
          version <- read.dcf("DESCRIPTION")[1, "Version"]

          if (!identical(tag, paste0("v", version))) {
            stop(
              sprintf(
                "Tag %s does not match DESCRIPTION version %s.",
                tag,
                version
              )
            )
          }

          roxygen2::roxygenise(".", roclets = c("rd", "namespace"))
          status <- system2("git", c("diff", "--quiet", "--", "man", "NAMESPACE"))
          if (status != 0) {
            stop("Generated documentation is stale.")
          }

      - name: Build source package
        shell: bash
        run: |
          R CMD build .
          test -f scr3way_0.1.0.tar.gz

      - name: Check source package
        shell: Rscript {0}
        run: |
          result <- rcmdcheck::rcmdcheck(
            "scr3way_0.1.0.tar.gz",
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check-release"
          )

          if (length(result$errors) > 0L) {
            stop("Release tarball check reported errors.")
          }
          if (length(result$warnings) > 0L) {
            stop("Release tarball check reported warnings.")
          }

      - name: Create release manifest
        shell: bash
        run: |
          sha256sum scr3way_0.1.0.tar.gz | tee scr3way_0.1.0.sha256
          wc -c scr3way_0.1.0.tar.gz | tee scr3way_0.1.0.bytes
          tar -tzf scr3way_0.1.0.tar.gz | tee scr3way_0.1.0.contents.txt

      - name: Create draft GitHub release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}"             --draft             --title "scr3way ${GITHUB_REF_NAME}"             --notes-file NEWS.md             scr3way_0.1.0.tar.gz             scr3way_0.1.0.sha256             scr3way_0.1.0.bytes             scr3way_0.1.0.contents.txt
